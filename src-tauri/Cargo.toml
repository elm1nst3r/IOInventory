# The MCP server lives in its own workspace member rather than a second [[bin]]
# here: with two binaries in this crate the Tauri CLI picks the wrong one as the
# app and bundles it (mainBinaryName only renames the file, it doesn't choose).
# `default-members` keeps a bare `cargo build` here scoped to the app.
[workspace]
members = ["mcp-server"]
default-members = ["."]

[package]
name = "agent-ledger"
version = "0.14.0"
description = "IO Inventory — developer & AI environment inventory"
authors = ["elm1nst3r"]
edition = "2021"

[lib]
name = "agent_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-std", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
anyhow = "1"
hostname = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
