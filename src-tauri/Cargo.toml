# The MCP server lives in its own workspace member rather than a second [[bin]]
# here: with two binaries in this crate the Tauri CLI picks the wrong one as the
# app and bundles it (mainBinaryName only renames the file, it doesn't choose).
# `default-members` keeps a bare `cargo build` here scoped to the app.
[workspace]
members = ["core", "mcp-server"]
default-members = ["."]

[package]
name = "agent-ledger"
version = "0.19.0"
description = "IO Inventory — developer & AI environment inventory"
authors = ["elm1nst3r"]
edition = "2021"

[lib]
name = "agent_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-ledger-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
