[package]
name = "agent-ledger-core"
version = "0.21.0"
description = "IO Inventory core — scan engine, item model, ledger persistence, and MCP server (no Tauri dependency)"
authors = ["elm1nst3r"]
edition = "2021"

[lib]
name = "agent_ledger_core"
crate-type = ["rlib"]

[dependencies]
libc = "0.2.189"
trash = { version = "5.2.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "fs", "io-std", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
anyhow = "1"
hostname = "0.4"
